name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deploys need an OIDC token and write access to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Let a running deploy finish rather than cancel it mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  EMSDK_VERSION: 3.1.74

jobs:
  test:
    name: Native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build-native -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-native --parallel

      - name: Run tests
        run: ctest --test-dir build-native --output-on-failure

  build-web:
    name: WebAssembly build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Configure
        run: emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-web --parallel

      - name: Check output
        run: ls -la dist && test -f dist/index.html && test -f dist/index.js && test -f dist/index.wasm

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
